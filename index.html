<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>SLI SMS</title>

  <!-- PWA 및 아이폰 홈 화면 아이콘 설정 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#e3ece7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SLI SMS">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  <style>
    :root {
      --skku-dark: #00331c;
      --skku-green: #004d2b;
      --skku-emerald: #0d6e43;
      --skku-tint: #edf5f1;
      --bg-start: #e3ece7;
      --bg-end: #eff4f1;
      --surface: #ffffff;
      --text-main: #141c18;
      --text-sub: #6c7a73;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(72px + env(safe-area-inset-top, 0px)) 18px calc(36px + env(safe-area-inset-bottom, 0px)) 18px;
    }

    @media (min-width: 520px) {
      body { padding: 32px 18px; }
    }

    .portal-box {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: 28px;
      padding: 40px 26px 26px 26px;
      border: 1px solid rgba(0, 51, 28, 0.08);
      box-shadow: 0 22px 50px rgba(0, 43, 23, 0.10), 0 4px 12px rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    .portal-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--skku-dark), var(--skku-emerald), var(--skku-dark));
    }

    .header {
      text-align: center;
      margin-bottom: 34px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(19px, 5vw, 22px);
      font-weight: 800;
      color: var(--skku-dark);
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .header-sub {
      margin: 5px 0 0 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.8px;
    }

    .header-line {
      width: 28px;
      height: 3px;
      background: var(--skku-emerald);
      border-radius: 2px;
      margin: 12px auto 0 auto;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px 14px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .app-item:hover { transform: translateY(-4px); }
    .app-item:active { transform: scale(0.92); }

    .app-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--skku-tint);
      border: 1px solid rgba(0, 77, 43, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0, 51, 28, 0.05);
      transition: all 0.2s ease;
    }

    .app-icon .material-symbols-rounded {
      font-size: 29px;
      color: var(--skku-green);
      transition: color 0.2s ease;
    }

    .app-item:hover .app-icon {
      background: var(--skku-green);
      border-color: var(--skku-green);
      box-shadow: 0 10px 20px rgba(0, 77, 43, 0.22);
    }

    .app-item:hover .app-icon .material-symbols-rounded { color: #ffffff; }

    .app-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
      letter-spacing: -0.3px;
      word-break: keep-all;
    }

    .copyright-footer {
      text-align: center;
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid #eef2f0;
      font-size: 11.5px;
      color: #8a9790;
      letter-spacing: 0.2px;
    }

    /* 캠퍼스 선택 바텀 시트 */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 25, 20, 0.45);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-panel {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 14px 22px calc(26px + env(safe-area-inset-bottom, 0px)) 22px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.12);
    }

    .sheet-backdrop.active .sheet-panel { transform: translateY(0); }

    @media (min-width: 520px) {
      .sheet-backdrop { align-items: center; padding: 20px; }
      .sheet-panel { border-radius: 24px; padding: 24px; transform: scale(0.95); }
      .sheet-backdrop.active .sheet-panel { transform: scale(1); }
    }

    .sheet-handle {
      width: 36px; height: 4px;
      background: #dce3df;
      border-radius: 4px;
      margin: 0 auto 18px auto;
    }

    @media (min-width: 520px) { .sheet-handle { display: none; } }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .sheet-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.4px;
    }

    .sheet-close {
      background: #f3f6f4;
      border: none;
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-sub);
    }

    .sheet-close .material-symbols-rounded { font-size: 19px; }

    .campus-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .campus-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: #f5f8f6;
      border: 1px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.18s ease;
    }

    .campus-option:hover, .campus-option:active {
      background: var(--skku-tint);
      border-color: rgba(0, 77, 43, 0.22);
    }

    .campus-info { text-align: left; }
    .campus-name { font-size: 15px; font-weight: 700; color: var(--skku-dark); display: block; }
    .campus-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; display: block; }
    .campus-option .material-symbols-rounded { color: var(--skku-green); font-size: 20px; }
  </style>
</head>
<body>

  <div class="portal-box">
    <div class="header">
      <h1>Smart Management System</h1>
      <p class="header-sub">SLI (SMS)</p>
      <div class="header-line"></div>
    </div>

    <div class="app-grid">
      <div class="app-item" onclick="openAppByKey('step1')">
        <div class="app-icon"><span class="material-symbols-rounded">edit_square</span></div>
        <div class="app-label">분반 시험<br>입력·관리</div>
      </div>

      <div class="app-item" onclick="openAppByKey('step2')">
        <div class="app-icon"><span class="material-symbols-rounded">diversity_3</span></div>
        <div class="app-label">세부 분반<br>시스템</div>
      </div>

      <div class="app-item" onclick="openAppByKey('step3')">
        <div class="app-icon"><span class="material-symbols-rounded">fact_check</span></div>
        <div class="app-label">학생 분반<br>장소 확인</div>
      </div>

      <div class="app-item" onclick="openAppByKey('step4')">
        <div class="app-icon"><span class="material-symbols-rounded">emoji_transportation</span></div>
        <div class="app-label">현장 학습<br>출결 관리</div>
      </div>

      <div class="app-item" onclick="openCampusSheet()">
        <div class="app-icon"><span class="material-symbols-rounded">manage_accounts</span></div>
        <div class="app-label">유진급<br>인원 관리</div>
      </div>

      <div class="app-item" onclick="openAppByKey('step6')">
        <div class="app-icon"><span class="material-symbols-rounded">grading</span></div>
        <div class="app-label">재시험<br>점수 관리</div>
      </div>
    </div>

    <div class="copyright-footer">
      © 2026 Developed by 최지현. All rights reserved.
    </div>
  </div>

  <!-- 유진급 캠퍼스 선택 시트 -->
  <div class="sheet-backdrop" id="campusSheet" onclick="closeCampusSheet()">
    <div class="sheet-panel" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 class="sheet-title">캠퍼스 선택</h2>
        <button type="button" class="sheet-close" onclick="closeCampusSheet()" aria-label="닫기">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <div class="campus-list">
        <button type="button" class="campus-option" onclick="selectCampus('step5_insa')">
          <div class="campus-info">
            <span class="campus-name">인문사회과학캠퍼스 (명륜)</span>
            <span class="campus-sub">인사캠 유진급 및 재시험 인원 관리</span>
          </div>
          <span class="material-symbols-rounded">chevron_right</span>
        </button>
        <button type="button" class="campus-option" onclick="selectCampus('step5_jagwa')">
          <div class="campus-info">
            <span class="campus-name">자연과학캠퍼스 (율전)</span>
            <span class="campus-sub">자과캠 유진급 및 재시험 인원 관리</span>
          </div>
          <span class="material-symbols-rounded">chevron_right</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1단계에서 복사한 구글 앱스 스크립트 웹 앱 URL을 아래 따옴표 안에 넣으세요
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycby_ASYZ_K8qQjrbNv74FT6xSz9u5JK2lUsB36zKXHkG2f6jRaHAjjTB9SVu6djiBoPmcg/exec';

    // 이전에 불러온 링크가 있으면 즉시 사용 (로딩 지연 방지)
    let appLinks = JSON.parse(localStorage.getItem('sli_sms_links') || '{}');

    // 백그라운드에서 구글 시트 최신 링크 자동 동기화
    async function syncLinks() {
      if (!GAS_API_URL.startsWith('http')) return;
      try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();
        appLinks = data;
        localStorage.setItem('sli_sms_links', JSON.stringify(data));
      } catch (e) {
        console.error('링크 동기화 실패:', e);
      }
    }
    syncLinks();

    function openAppByKey(key) {
      const url = appLinks[key];
      if (url) {
        window.location.href = url;
        return;
      }
      syncLinks().then(() => {
        if (appLinks[key]) {
          window.location.href = appLinks[key];
        } else {
          alert('링크 데이터를 불러오지 못했습니다. Apps Script 새 버전 배포를 확인해 주세요.');
        }
      });
    }

    function openCampusSheet() {
      document.getElementById('campusSheet').classList.add('active');
    }

    function closeCampusSheet() {
      document.getElementById('campusSheet').classList.remove('active');
    }

    function selectCampus(key) {
      closeCampusSheet();
      openAppByKey(key);
    }
  </script>

</body>
</html>
